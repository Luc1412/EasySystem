[project]
name = "easysystem"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "red-discordbot==3.5.24",
]

[tool.ruff.lint]
select = [        
    "E", # pycodestyle
    "F", # Pyflakes
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "I", # isort
    "FAST", # fastapi
]
ignore = [
    "E501", # line too long
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
# Red's public API still exposes unannotated parameters and return values.
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportMissingTypeArgument = false

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.0",
]
